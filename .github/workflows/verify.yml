name: Native source verification
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: native-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    if: github.event.repository.private == false
    runs-on: macos-15
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Public source boundaries
        run: python3 scripts/verify-public.py --profile custom
      - name: Toolchain
        run: swift --version
      - name: Shared source and fixture regressions
        run: swift test --jobs 2
      - name: Owned executable products
        run: |
          swift build -c release --product ResearchBaselineEnhanced --jobs 2
          swift build -c release --product PipResearch --jobs 2
          swift build -c release --product PipResearchEnhanced --jobs 2
